<!DOCTYPE html><html class="h-full bg-slate-100" lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Actualizar Datos del Paciente - MediDesk Pro</title>
<!-- Tailwind CSS v3 CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Font: League Spartan -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind Custom Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e'
            }
          }
        }
      }
    }
  </script>
<!-- Mandatory Global Typography & Style Overrides -->
<style data-purpose="typography">
    * {
      font-family: 'League Spartan', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }
  </style>
<style data-purpose="form-details">
    input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }
  </style>
</head>
<body class="min-h-full bg-slate-100 text-slate-800 flex flex-col antialiased selection:bg-sky-500 selection:text-white">
<!-- BEGIN: DesktopNativeWindowBar -->
<!-- Top bar representing the desktop app shell of MediDesk Pro v2.4 -->

<!-- END: DesktopNativeWindowBar -->
<!-- BEGIN: MainContentArea -->
<main class="flex-1 py-8 px-4 sm:px-6 lg:px-8 flex justify-center items-start overflow-y-auto">
<!-- Central Desktop Container / Card Window -->
<div class="w-full max-w-4xl bg-white border border-slate-200/90 rounded-2xl shadow-sm overflow-hidden" data-purpose="patient-update-card">
<!-- BEGIN: CardHeader -->
<div class="px-8 pt-8 pb-6 border-b border-slate-100 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
<div>
<!-- Title with strict requested styling -->
<h1 class="text-2xl font-bold tracking-tight text-slate-900 uppercase">
            Actualizar Datos del Paciente
          </h1>
<p class="text-sm text-slate-500 font-normal mt-1">
            Modificación de expediente clínico, datos demográficos y registro oficial
          </p>
</div>
<!-- Read-only Reference Metadata Pill -->

</div>
<!-- END: CardHeader -->
<!-- BEGIN: PatientUpdateForm -->
<form action="#" class="p-8 space-y-6" data-purpose="patient-edit-form" method="POST" onsubmit="event.preventDefault();">
<!-- ROW 1: Nombre(s), Apellido Paterno, Apellido Materno (3 Columns as per wireframe) -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
<!-- Field: Nombre(s) -->
<div>
<label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" for="nombres">
              Nombre (s) <span class="text-rose-500">*</span>
</label>
<input class="w-full h-11 px-3.5 rounded-lg border border-slate-300 bg-white text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#0284c7] focus:border-transparent transition-shadow" id="nombres" name="nombres" placeholder="Nombre (s)" required="" type="text" value="Carlos Alberto">
</div>
<!-- Field: Apellido Paterno -->
<div>
<label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" for="apellido-paterno">
              Apellido Paterno <span class="text-rose-500">*</span>
</label>
<input class="w-full h-11 px-3.5 rounded-lg border border-slate-300 bg-white text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#0284c7] focus:border-transparent transition-shadow" id="apellido-paterno" name="apellido_paterno" placeholder="Apellido Paterno" required="" type="text" value="Mendoza">
</div>
<!-- Field: Apellido Materno -->
<div>
<label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" for="apellido-materno">
              Apellido Materno
            </label>
<input class="w-full h-11 px-3.5 rounded-lg border border-slate-300 bg-white text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#0284c7] focus:border-transparent transition-shadow" id="apellido-materno" name="apellido_materno" placeholder="Apellido Materno" type="text" value="Ruiz">
</div>
</div>
<!-- ROW 2: CURP (Extended) & Fecha de Nacimiento (2 Columns as per wireframe) -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-6">
<!-- Field: CURP (Extended Column, 8 cols width) -->
<div class="md:col-span-8">
<div class="flex items-center justify-between mb-2">
<label class="block text-xs font-bold text-slate-700 uppercase tracking-wider" for="curp">
                CURP <span class="text-rose-500">*</span>
</label>

</div>
<div class="relative">
<input class="w-full h-11 px-3.5 font-mono uppercase tracking-wider rounded-lg border border-slate-300 bg-white text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#0284c7] focus:border-transparent transition-shadow" id="curp" maxlength="18" name="curp" placeholder="curp" required="" type="text" value="MERC840912HDFNR03">
</div>
</div>
<!-- Field: Fecha de Nacimiento (4 cols width) -->
<div class="md:col-span-4">
<label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" for="fecha-nacimiento">
              Fecha de Nacimiento <span class="text-rose-500">*</span>
</label>
<div class="relative">
<input class="w-full h-11 px-3.5 rounded-lg border border-slate-300 bg-white text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#0284c7] focus:border-transparent transition-shadow" id="fecha-nacimiento" name="fecha_nacimiento" placeholder="dd/mm/aaaa" required="" type="text" value="12/09/1984">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
</div>
<!-- ROW 3: Complementary Clinical Metadata (Cohesive with MediDesk ecosystem) -->
<div class="pt-4 border-t border-slate-100">
<p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Información de Contacto y Perfil Clínico</p>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
<!-- Contact Phone -->
<div>
<label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" for="telefono">
                Teléfono de Contacto
              </label>
<input class="w-full h-11 px-3.5 rounded-lg border border-slate-300 bg-white text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#0284c7] focus:border-transparent transition-shadow" id="telefono" name="telefono" placeholder="+52 55 0000 0000" type="tel" value="+52 55 4192 8831">
</div>
<!-- Biological Sex -->
<div>
<label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" for="sexo">
                Sexo Biológico
              </label>
<select class="w-full h-11 px-3.5 rounded-lg border border-slate-300 bg-white text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#0284c7] focus:border-transparent transition-shadow" id="sexo" name="sexo">
<option selected="" value="M">Masculino</option>
<option value="F">Femenino</option>
<option value="O">Otro / No especificado</option>
</select>
</div>
<!-- System Status -->
<div>
<label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" for="estado-paciente">
                Estado del Paciente
              </label>
<select class="w-full h-11 px-3.5 rounded-lg border border-slate-300 bg-white text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-[#0284c7] focus:border-transparent transition-shadow" id="estado-paciente" name="estado_paciente">
<option selected="" value="activo">Activo (Con Expediente Vigente)</option>
<option value="inactivo">Inactivo / Baja Temporal</option>
</select>
</div>
</div>
</div>
<!-- Feedback Alert / Micro Notice -->
<div class="flex items-start gap-3 p-3.5 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-600">
<svg class="w-4 h-4 text-sky-600 mt-0.5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" fill-rule="evenodd"></path>
</svg>
<div class="">
            Los cambios reflejados en el expediente actualizarán automáticamente la carátula en Consultas Externas, Triage e historial farmacológico.
          </div>
</div>
<!-- BEGIN: FormActions -->
<!-- Actions footer matching wireframe's central action with clinical system buttons -->
<div class="pt-6 border-t border-slate-100 flex flex-col-reverse sm:flex-row items-center justify-center gap-4">
<!-- Secondary Action: Cancel -->
<button class="w-full sm:w-auto px-7 py-3 text-sm font-medium text-slate-600 hover:text-slate-800 bg-white hover:bg-slate-50 border border-slate-300 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-slate-300" onclick="window.history.back()" type="button">
            Cancelar / Volver a Expediente
          </button>
<!-- Primary Action: Guardar (Wireframe prominent button) -->
<button class="w-full sm:w-64 py-3 px-6 text-sm font-semibold text-white bg-[#0284c7] hover:bg-[#0369a1] active:bg-[#075985] rounded-lg shadow-sm hover:shadow transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#0284c7]" type="submit">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
            Guardar Cambios
          </button>
</div>
<!-- END: FormActions -->
</form>
<!-- END: PatientUpdateForm -->
</div>
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: DesktopFooter -->

<!-- END: DesktopFooter -->


</body></html>
